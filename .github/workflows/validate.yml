name: Validate pull request

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify public project pages
        run: |
          test -f dist/index.html
          test -f dist/work/tilearray/index.html
          test -f dist/work/bat-habitat-yorkshire/index.html
          test -f dist/work/sheffield-bats/index.html
          test -f dist/images/hsm/panel-daubenton-if.webp
          test -f dist/images/hsm/panel-recording-intensity.webp
          test ! -e dist/images/hsm/yorkshire-daubentons-in-flight-2026.png
          test ! -e dist/images/hsm/yorkshire-noctule-roost-2026.png
          ! grep -q 'fonts.googleapis.com\|fonts.gstatic.com' dist/work/tilearray/index.html
          ! grep -q 'fonts.googleapis.com\|fonts.gstatic.com' dist/work/bat-habitat-yorkshire/index.html
          test ! -e dist/work/habitat-mapping/index.html
          test ! -e dist/work/camera-trap-triage/index.html
          test ! -e dist/work/book-chain-eudr/index.html
